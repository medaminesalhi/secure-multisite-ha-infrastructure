
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
        }

        header {
            background: #172554;
            color: white;
            padding: 28px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
            color: #cbd5e1;
        }

        main {
            max-width: 850px;
            margin: 35px auto;
            padding: 0 16px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 24px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
        }

        h2 {
            margin-top: 0;
        }

        form {
            display: flex;
            gap: 12px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 13px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #f8fafc;
        }

        .empty {
            color: #64748b;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 550px) {
            form {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Student Manager</h1>
    </header>

    <main>

        <section class="card">
            <h2>Ajouter un étudiant</h2>

            <form action="/students" method="post">
                <input
                    type="text"
                    name="full_name"
                    placeholder="Nom complet"
                    maxlength="100"
                    required
                >

                <button type="submit">
                    Ajouter
                </button>
            </form>
        </section>

        <section class="card">
            <h2>Liste des étudiants</h2>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom complet</th>
                        <th>Date d'ajout</th>
                    </tr>
                </thead>

                <tbody>
                    {% for student in students %}
                    <tr>
                        <td>{{ student.id }}</td>

                        <td>
                            {{ student.full_name | e }}
                        </td>

                        <td>
                            {{ student.created_at }}
                        </td>
                    </tr>

                    {% else %}
                    <tr>
                        <td colspan="3" class="empty">
                            Aucun étudiant enregistré.
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

        </section>

    </main>

</body>
</html>
