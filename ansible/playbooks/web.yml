
---
- name: Configurer le serveur Web
  hosts: web
  become: true

  tasks:
    - name: Installer Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Déployer la page HTML
      ansible.builtin.copy:
        src: ../files/index.html
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: "0644"

    - name: Vérifier la configuration Nginx
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Activer et démarrer Nginx
      ansible.builtin.service:
        name: nginx
        enabled: true
        state: started

    - name: Tester la réponse HTTP locale
      ansible.builtin.uri:
        url: http://127.0.0.1/
        status_code: 200
        return_content: true
      register: web_response

    - name: Afficher le résultat du test
      ansible.builtin.debug:
        msg: "Nginx répond avec le statut HTTP {{ web_response.status }}"
