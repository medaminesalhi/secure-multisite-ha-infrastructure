
---
- name: Validate Keepalived variables
  ansible.builtin.assert:
    that:
      - keepalived_interface | length > 0
      - keepalived_virtual_ip | length > 0
      - keepalived_source_ip | length > 0
      - keepalived_peer_ip | length > 0
      - keepalived_source_ip != keepalived_peer_ip
      - keepalived_priority | int > 0
      - keepalived_priority | int < 255
    fail_msg: "Invalid Keepalived configuration variables."

- name: Install Keepalived
  ansible.builtin.apt:
    name: "{{ keepalived_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Read IPv4 addresses of the LAN interface
  ansible.builtin.command:
    cmd: "ip -o -4 addr show dev {{ keepalived_interface }}"
  register: keepalived_interface_addresses
  changed_when: false

- name: Verify VRRP source IP belongs to the LAN interface
  ansible.builtin.assert:
    that:
      - keepalived_source_ip in keepalived_interface_addresses.stdout
    fail_msg: "The VRRP source IP is not on the configured interface."

- name: Deploy HAProxy health check script
  ansible.builtin.template:
    src: check-haproxy.sh.j2
    dest: "{{ keepalived_check_script_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart Keepalived

- name: Test HAProxy health check script
  ansible.builtin.command:
    cmd: "{{ keepalived_check_script_path }}"
  changed_when: false

- name: Deploy Keepalived configuration
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: "/usr/sbin/keepalived -t -f %s"
  notify: Restart Keepalived

- name: Ensure Keepalived service is running
  ansible.builtin.systemd_service:
    name: "{{ keepalived_service }}"
    state: started
    enabled: true

- name: Apply pending Keepalived restart
  ansible.builtin.meta: flush_handlers
