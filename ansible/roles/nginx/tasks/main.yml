
---
- name: Install Nginx
  ansible.builtin.apt:
    name: "{{ nginx_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure web root directory exists
  ansible.builtin.file:
    path: "{{ nginx_web_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy static HTML page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ nginx_web_root }}/index.html"
    owner: root
    group: root
    mode: "0644"
  when: not (nginx_proxy_enabled | bool)

- name: Deploy Nginx configuration
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Enable Nginx default site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/default
    dest: /etc/nginx/sites-enabled/default
    state: link
  notify: Reload nginx

- name: Validate Nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Ensure Nginx service is running
  ansible.builtin.service:
    name: "{{ nginx_service }}"
    state: started
    enabled: true

- name: Apply pending Nginx reload
  ansible.builtin.meta: flush_handlers

- name: Verify HTTP response
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ nginx_listen_port }}/"
    method: GET
    status_code: 200
    return_content: true
    use_proxy: false
  register: nginx_response
  retries: 5
  delay: 2
  until: nginx_response.status == 200

- name: Verify Student Manager response
  ansible.builtin.assert:
    that:
      - "'Student Manager' in nginx_response.content"
    fail_msg: "Application response not found."
    success_msg: "Student Manager is accessible through Nginx."
  when: nginx_proxy_enabled | bool

- name: Verify static HTML response
  ansible.builtin.assert:
    that:
      - nginx_health_marker in nginx_response.content
    fail_msg: "Static HTML response is invalid."
  when: not (nginx_proxy_enabled | bool)
